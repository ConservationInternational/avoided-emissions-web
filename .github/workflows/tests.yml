name: Tests

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: webapp/requirements*.txt

      - name: Install Python dependencies
        run: pip install -r webapp/requirements.txt -r webapp/requirements-dev.txt

      - name: Run unit tests
        env:
          SECRET_KEY: ci-unit-test-secret-key-at-least-32-chars
          ENCRYPTION_KEY: ci-unit-test-encryption-key-32ch!!
          ROLLBAR_ACCESS_TOKEN: ""
          ENVIRONMENT: test
        run: python -m pytest tests/unit/ -v -m unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ae_user
          POSTGRES_PASSWORD: ae_password
          POSTGRES_DB: avoided_emissions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ae_user -d avoided_emissions_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: webapp/requirements*.txt

      - name: Install Python dependencies
        run: pip install -r webapp/requirements.txt -r webapp/requirements-dev.txt

      - name: Run Alembic migrations
        env:
          PYTHONPATH: ${{ github.workspace }}/webapp
          POSTGRES_USER: ae_user
          POSTGRES_PASSWORD: ae_password
          POSTGRES_DB: avoided_emissions_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          SECRET_KEY: ci-integration-test-secret-key-at-least-32-chars
          ENCRYPTION_KEY: ci-integration-test-encryption-key-32c!
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          ROLLBAR_ACCESS_TOKEN: ""
          ENVIRONMENT: test
        run: cd webapp && alembic upgrade head

      - name: Run integration tests
        env:
          POSTGRES_USER: ae_user
          POSTGRES_PASSWORD: ae_password
          POSTGRES_DB: avoided_emissions_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          ROLLBAR_ACCESS_TOKEN: ""
          ENVIRONMENT: test
        run: python -m pytest tests/integration/ -v -m integration
